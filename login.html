<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/png" href="./Screenshot_16-removebg-preview.png">

</head>
<body>
<div class="container">

    <div class="card">
        <a href="./index.html"><h1>Login</h1></a>
        <div class="inputBox">
            <input type="email" placeholder="Email" id="email">
            <small id="errorEmail"></small>
            <input type="password" placeholder="Password" id="password">
            <small id="errorPassword"></small>
        </div>
        <div class="options">
            <div class="checkbox">
                <input type="checkbox" id="remember">
                <p>Remember me</p>
            </div>
            <a href="#">Forgot Password?</a>
        </div>
        <a href="" class="btn" id="submit">
            Login
        </a>
    </div>
</div>
<script>
    const submit = document.getElementById("submit");
    submit.addEventListener("click", (e) => {
    e.preventDefault();

        const email = document.getElementById("email").value
        const password = document.getElementById("password").value

        if(email === ""){
            document.getElementById("errorEmail").textContent = "Email is required"
            return;
        }
        if(email !== "ogunsanmiolayimika@gmail.com"){
            document.getElementById("errorEmail").textContent = "Email Incorrect"
            return;
        }
        
        if(password === ""){
            document.getElementById("errorPassword").textContent = "Password is required"
            return;
        }

    window.location.href = "./dashboard.html";
    })
</script>
</body>
</html>
